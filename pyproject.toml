[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openapi-codegen-agent"
version = "1.0.0"
description = "AI-driven procedure replacing traditional CodeGen tools for generating REST API client libraries"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Artur Ziółkowski" }]
keywords = ["openapi", "codegen", "ai", "agent", "swagger", "rest-api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
requires-python = ">=3.8"

[project.urls]
Homepage = "https://github.com/arturjadach/openapi-codegen-agent"
LinkedIn = "https://www.linkedin.com/in/arturjadach/"

[project.scripts]
openapi-codegen-agent = "openapi_codegen_agent.cli:main"

[tool.setuptools.packages.find]
include = ["openapi_codegen_agent*"]

[tool.setuptools.package-data]
openapi_codegen_agent = ["agent/*.md"]
